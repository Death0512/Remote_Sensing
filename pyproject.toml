[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-sensing-surveillance"
version = "0.1.0"
description = "Territorial Remote Sensing Surveillance System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Security Surveillance Team" }
]
dependencies = [
    "rasterio>=1.3.9",
    "shapely>=2.0.2",
    "geopandas>=0.14.0",
    "pyproj>=3.6.1",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",
    "scipy>=1.12.0",
    "opencv-python-headless>=4.9.0",
    "pystac-client>=0.7.5",
    "planetary-computer>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
    "black>=24.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
rss-cli = "src.cli.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "weights: marks tests that require pretrained model weights checkpoints",
    "slow: marks slow-running end-to-end integration tests",
]
