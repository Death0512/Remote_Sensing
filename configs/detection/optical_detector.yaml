schema_version: "optical_detector.v1"

obb_model:
  architecture: "YOLOv8-OBB"
  weights_key: "yolov8_obb"
  conf_threshold: 0.25
  iou_threshold: 0.45
  geometry_mode: "OBB"
  capability: "external_model"

heuristic_aabb:
  geometry_mode: "AABB"
  capability: "heuristic"
  threshold: 0.5
  min_area_px: 4
  max_area_px: 5000
  pixel_spacing_m: 0.5

candidate_generator:
  threshold: 0.5
  min_area_px: 4
  max_area_px: 5000
  pixel_spacing_m: 0.5

target_classes:
  aircraft:
    min_length_m: 8.0
    max_length_m: 85.0
    min_width_m: 5.0
    max_width_m: 85.0
    min_aspect_ratio: 0.8
    max_aspect_ratio: 6.0
  vessel:
    min_length_m: 10.0
    max_length_m: 450.0
    min_width_m: 2.0
    max_width_m: 100.0
    min_aspect_ratio: 1.0
    max_aspect_ratio: 15.0
